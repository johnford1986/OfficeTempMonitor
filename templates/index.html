<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SERT Office Monitor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#23272b;
            color:white;
        }

        .card{
            border:none;
            border-radius:18px;
        }

        .value{
            font-size:4.5rem;
            font-weight:300;
        }

        .last-updated{
            font-size:1.3rem;
            font-weight:600;
        }

        .next-update{
            font-size:1.15rem;
            margin-top:18px;
            color:#d9d9d9;
        }

        h1{
            font-weight:300;
        }

    </style>

    <!-- Refresh page every 30 seconds -->


</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        🌡 SERT Office Monitor
    </h1>

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card shadow-lg" id="tempCard">

                <div class="card-body text-center">

                    <h5>Temperature</h5>

                    <div class="value">

                        {{ temperature }}°

                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-lg" id="humidityCard">

                <div class="card-body text-center">

                    <h5>Humidity</h5>

                    <div class="value">

                        {{ humidity }}%

                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-warning text-dark shadow-lg">

                <div class="card-body text-center">

                    <h5>Battery</h5>

                    <h1 class="display-4">

                        🔋 {{ battery }}

                    </h1>

                </div>

            </div>

        </div>

    </div>

    <div class="card bg-secondary mt-4 shadow">

        <div class="card-body text-center">

            <h5 class="mb-3">
                Last Updated
            </h5>

            <div class="last-updated" id="timestamp">
                {{ timestamp }}
            </div>

            <div class="next-update">
                Next Update:
                <strong id="nextUpdate">
                    Calculating...
                </strong>
            </div>

        </div>

    </div>

</div>

<div class="container mt-5 mb-5">

    <div class="card bg-secondary shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">

                Temperature History

            </h2>

            <div style="height:420px">

                <canvas id="tempChart"></canvas>

            </div>

        </div>

    </div>

</div>

<script>

// --------------------
// Format Last Updated
// --------------------

const ts = document.getElementById("timestamp");

let lastUpdate = null;

try{

    lastUpdate = new Date(ts.innerText);

    ts.innerHTML =
        lastUpdate.toLocaleDateString(undefined,{
            weekday:'long',
            year:'numeric',
            month:'long',
            day:'numeric'
        }) +
        "<br>" +
        lastUpdate.toLocaleTimeString();

}
catch(e){}

// --------------------
// Next Update Countdown
// --------------------

function updateCountdown(){

    if(!lastUpdate) return;

    const next = new Date(lastUpdate.getTime() + (5 * 60 * 1000));

    const now = new Date();

    let diff = next - now;

    if(diff < 0){

        document.getElementById("nextUpdate").innerHTML =
            "Updating...";

        return;
    }

    const minutes = Math.floor(diff / 60000);

    const seconds = Math.floor((diff % 60000) / 1000);

    document.getElementById("nextUpdate").innerHTML =
        `${minutes}m ${seconds}s`;

}

updateCountdown();

setInterval(updateCountdown,1000);

// --------------------
// Temperature Chart
// --------------------

let tempChart;

async function loadChart() {

    const response = await fetch("/api/history");
    const data = await response.json();

    const labels = data.map(r => {

        const d = new Date(r.timestamp);

        return d.toLocaleTimeString([],{
            hour:'2-digit',
            minute:'2-digit'
        });

    });

    const temps = data.map(r => r.temperature);

    const ctx = document.getElementById("tempChart").getContext("2d");

    tempChart = new Chart(ctx, {

        type: "line",

        data: {

            labels: labels,

            datasets: [{

                label: "Office Temperature",

                data: temps,

                borderColor: "#00d4ff",

                backgroundColor: "rgba(0,212,255,.18)",

                fill: true,

                borderWidth: 4,

                pointRadius: 3,

                pointHoverRadius: 6,

                tension: .35

            }]

        },

        options: {

            responsive:true,

            maintainAspectRatio:false,

            plugins:{

                legend:{

                    labels:{

                        color:"white",

                        font:{
                            size:16
                        }

                    }

                }

            },

            scales:{

                x:{

                    ticks:{

                        color:"white",

                        maxTicksLimit: 12

                    },

                    grid:{

                        color:"rgba(255,255,255,0.08)"

                    }

                },

                y:{

                    min: 60,

                    max: 90,

                    ticks:{

                        color:"white",

                        stepSize: 5

                    },

                    grid:{

                        color:"rgba(255,255,255,0.08)"

                    }

                }

            }

        }

    });

}

loadChart();

updateTemperatureColor({{ temperature }});

updateHumidityColor({{ humidity }});

function updateHumidityColor(humidity) {

    const card = document.getElementById("humidityCard");

    card.classList.remove(
        "bg-primary",
        "bg-success",
        "bg-warning",
        "bg-danger",
        "text-dark",
        "text-white"
    );

    if (humidity < 20) {

        card.classList.add("bg-primary", "text-white");

    }
    else if (humidity <= 40) {

        card.classList.add("bg-success", "text-white");

    }
    else if (humidity < 60) {

        card.classList.add("bg-warning", "text-dark");

    }
    else {

        card.classList.add("bg-danger", "text-white");

    }

}

// --------------------
// Refresh Temperature Chart
// --------------------

async function refreshChart() {

    const response = await fetch("/api/history");
    const data = await response.json();

    tempChart.data.labels = data.map(r => {

        const d = new Date(r.timestamp);

        return d.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    });

    tempChart.data.datasets[0].data =
        data.map(r => r.temperature);

    tempChart.update();

}

setInterval(refreshChart, 30000);

// --------------------
// Live Dashboard Update
// --------------------

async function refreshDashboard() {

    try {

        const response = await fetch("/api/latest");

        const data = await response.json();

        document.querySelector(".bg-primary .value").innerHTML =
            data.temperature + "°";

        document.querySelector(".bg-success .value").innerHTML =
            data.humidity + "%";

        document.querySelector(".bg-warning h1").innerHTML =
            "🔋 " + data.battery;

        const ts = document.getElementById("timestamp");

        ts.innerHTML = data.timestamp.replace("\n","<br>");

        updateTemperatureColor(data.temperature);
        updateHumidityColor(data.humidity);

        lastUpdate = new Date(data.timestamp);

        updateCountdown();

    }
    catch(err){

        console.log(err);

    }

}

setInterval(refreshDashboard,30000);

function updateTemperatureColor(temp) {

    const card = document.getElementById("tempCard");

    card.classList.remove(
        "bg-primary",
        "bg-success",
        "bg-warning",
        "bg-danger",
        "text-dark",
        "text-white"
    );

    if (temp < 67) {

        card.classList.add("bg-primary", "text-white");

    }
    else if (temp <= 74) {

        card.classList.add("bg-success", "text-white");

    }
    else if (temp < 78) {

        card.classList.add("bg-warning", "text-dark");

    }
    else {

        card.classList.add("bg-danger", "text-white");

    }

}

</script>

</body>

</html>
