<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SERT Office Monitor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        🌡 SERT Office Monitor
    </h1>

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card shadow-lg" id="tempCard">

                <div class="card-body text-center">

                    <h5>Temperature</h5>

                    <div class="value">

                        {{ temperature }}°

                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-lg" id="humidityCard">

                <div class="card-body text-center">

                    <h5>Humidity</h5>

                    <div class="value">

                        {{ humidity }}%

                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-white text-dark shadow-lg" id="batteryCard">

                <div class="card-body text-center">

                    <h5>Battery</h5>

                    <h1 class="display-4 value">

                        🔋 {{ battery }}

                    </h1>

                </div>

            </div>

        </div>

    </div>

    <div class="card bg-secondary mt-4 shadow">

        <div class="card-body text-center">

            <h5 class="mb-3">
                Last Updated
            </h5>

            <div class="last-updated">
                <div id="date">{{ date }}</div>
                <div id="time">{{ time }}</div>
            </div>

            <div class="next-update">
                Next Update:
                <strong id="nextUpdate">
                    Calculating...
                </strong>
            </div>

        </div>

    </div>

</div>

<div class="container mt-5 mb-5">

    <div class="card bg-secondary shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">

                SERT Office Environment History

            </h2>

            <div style="height:420px">

                <div id="historyChart"></div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
