<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Office Environment Monitor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#23272b;
            color:white;
        }

        .card{
            border:none;
            border-radius:18px;
        }

        .value{
            font-size:4.5rem;
            font-weight:300;
        }

        .last-updated{
            font-size:1.3rem;
            font-weight:600;
        }

        h1{
            font-weight:300;
        }

    </style>

    <!-- Refresh page every 30 seconds -->
    <meta http-equiv="refresh" content="30">

</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        🌡 Office Environment Monitor
    </h1>

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card bg-primary shadow-lg">

                <div class="card-body text-center">

                    <h5>Temperature</h5>

                    <div class="value">

                        {{ temperature }}°

                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-success shadow-lg">

                <div class="card-body text-center">

                    <h5>Humidity</h5>

                    <div class="value">

                        {{ humidity }}%

                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-warning text-dark shadow-lg">

                <div class="card-body text-center">

                    <h5>Battery</h5>

                    <h1 class="display-4">

                        🔋 {{ battery }}

                    </h1>

                </div>

            </div>

        </div>

    </div>

    <div class="card bg-secondary mt-4 shadow">

        <div class="card-body text-center">

            <h5 class="mb-3">
                Last Updated
            </h5>

            <div class="last-updated" id="timestamp">
                {{ timestamp }}
            </div>

        </div>

    </div>

</div>

<div class="container mt-5 mb-5">

    <div class="card bg-secondary shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">

                Temperature History

            </h2>

            <div style="height:420px">

                <canvas id="tempChart"></canvas>

            </div>

        </div>

    </div>

</div>

<script>

// Format timestamp nicely
const ts = document.getElementById("timestamp");

try{

    const d = new Date(ts.innerText);

    ts.innerHTML =
        d.toLocaleDateString(undefined,{
            weekday:'long',
            year:'numeric',
            month:'long',
            day:'numeric'
        }) +
        "<br>" +
        d.toLocaleTimeString();

}
catch(e){}

let tempChart;

async function loadChart() {

    const response = await fetch("/api/history");
    const data = await response.json();

    const labels = data.map(r => {

        const d = new Date(r.timestamp);

        return d.toLocaleTimeString([],{
            hour:'2-digit',
            minute:'2-digit'
        });

    });

    const temps = data.map(r => r.temperature);

    const ctx = document.getElementById("tempChart").getContext("2d");

    tempChart = new Chart(ctx, {

        type: "line",

        data: {

            labels: labels,

            datasets: [{

                label: "Office Temperature",

                data: temps,

                borderColor: "#00d4ff",

                backgroundColor: "rgba(0,212,255,.18)",

                fill: true,

                borderWidth: 4,

                pointRadius: 3,

                pointHoverRadius: 6,

                tension: .35

            }]

        },

        options: {

            responsive:true,

            maintainAspectRatio:false,

            plugins:{

                legend:{

                    labels:{

                        color:"white",

                        font:{

                            size:16

                        }

                    }

                }

            },

            scales:{

                x:{

                    ticks:{

                        color:"white"

                    },

                    grid:{

                        color:"#555"

                    }

                },

                y:{

                    ticks:{

                        color:"white"

                    },

                    grid:{

                        color:"#555"

                    }

                }

            }

        }

    });

}

loadChart();

</script>

</body>

</html>
